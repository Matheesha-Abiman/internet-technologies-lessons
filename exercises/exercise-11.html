<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bouncing Circles</title>
    <style>
        body {
            background-color: antiquewhite;
        }

        .container {
            width: 100%;
            max-width: 700px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            justify-content: space-between;
        }

        .circle {
            height: 50px;
            width: 50px;
            border-radius: 50%;
            background-color: black;
        }

        .c1 {
            animation: bounce 2s ease-in-out infinite;
        }

        .c2 {
            animation: bounce 2s ease-in-out infinite 0.2s;
        }

        .c3 {
            animation: bounce 2s ease-in-out infinite 0.4s;
        }

        .c4 {
            animation: bounce 2s ease-in-out infinite 0.6s;
        }

        .c5 {
            animation: bounce 2s ease-in-out infinite 0.8s;
        }

        @keyframes bounce {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(200px);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="circle c1"></div>
        <div class="circle c2"></div>
        <div class="circle c3"></div>
        <div class="circle c4"></div>
        <div class="circle c5"></div>
    </div>
</body>

</html>
