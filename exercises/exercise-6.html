<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-6</title>
    <style>
        body {
            background-color: antiquewhite;
            margin: 0;
        }

        .box1 {
            height: 100px;
            width: 100px;
            border: 1px solid black;
            background-color: red;
            border-bottom-right-radius: 100%;

        }

        .box2 {
            height: 100px;
            width: 100px;
            border: 1px solid black;
            background-color: rgb(207, 194, 74);
            position: relative;
            left: 1748px;
            bottom: 102px;
            border-bottom-left-radius: 100%;
        }

        .box3 {
            height: 100px;
            width: 100px;
            border: 1px solid black;
            background-color: rgb(83, 221, 29);
            position: relative;
            left: 1748px;
            top: 625px;
            border-top-left-radius: 100%;
        }

        .box4 {
            height: 100px;
            width: 100px;
            border: 1px solid black;
            background-color: rgb(54, 15, 228);
            position: relative;
            top: 524px;
            border-top-right-radius: 100%;
        }

        .box5 {
            height: 300px;
            width: 300px;
            border: 1px solid black;
            background-color: rgb(21, 241, 186);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

        }

        .circle1 {
            height: 100px;
            width: 100px;
            border: 1px solid black;
            border-radius: 50px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: chartreuse;
        }
    </style>
</head>

<body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div class="box3"></div>
    <div class="box4"></div>
    <div class="box5">
        <div class="circle1"></div>
    </div>

</body>

</html>
